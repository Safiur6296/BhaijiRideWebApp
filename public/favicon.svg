<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1E24"/>
      <stop offset="100%" stop-color="#090B0E"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF6D00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#26303E" stroke-width="8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFB300" stroke-opacity="0.2" stroke-width="4" stroke-dasharray="10 10"/>
  <!-- Motorcycle silhouette -->
  <g transform="translate(64, 96)" filter="url(#glow)">
    <!-- Back wheel -->
    <circle cx="76" cy="230" r="54" fill="none" stroke="url(#amberGlow)" stroke-width="22"/>
    <circle cx="76" cy="230" r="18" fill="url(#amberGlow)"/>
    <!-- Front wheel -->
    <circle cx="308" cy="230" r="54" fill="none" stroke="url(#amberGlow)" stroke-width="22"/>
    <circle cx="308" cy="230" r="18" fill="url(#amberGlow)"/>
    <!-- Frame / Body -->
    <path d="M 76 230 L 160 170 L 220 170 L 308 230" fill="none" stroke="url(#amberGlow)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 160 170 L 195 90 L 250 90" fill="none" stroke="url(#amberGlow)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 195 90 L 130 110" fill="none" stroke="#FFF" stroke-width="12" stroke-linecap="round"/>
    <path d="M 130 135 L 180 135" fill="none" stroke="#FFF" stroke-width="14" stroke-linecap="round"/>
    <!-- Rider helmet hint -->
    <circle cx="170" cy="50" r="28" fill="#FFF"/>
    <!-- Headlight glow beam -->
    <polygon points="260,85 360,60 360,110" fill="#FFB300" opacity="0.35"/>
  </g>
</svg>
